defaults:
  text_timeout_seconds: 20
  audio_timeout_seconds: 30
  tts_voice:
    language_code: en-US
    ssml_gender: NEUTRAL

apps:
  - name: bidi-demo-prod
    ws_url: wss://bidi-demo-761793285222.us-central1.run.app
    query: "What time is it in Tokyo?"

  - name: adk-live-translator-prod
    ws_url: wss://live-translation-761793285222.us-central1.run.app
    ws_query_params:
      source: en
      target: ja
    setup_message: '{"glossary":[]}'
    text_probe_enabled: false
    query: "What time is it in Tokyo?"

  - name: grounding-demo-prod
    ws_url: wss://grounding-demo-761793285222.us-east1.run.app
    text_probe_enabled: false
    audio_timeout_seconds: 45
    query: "What is the Strat tower?"

  # 事例の森 — Japanese Google Cloud case-study search agent
  # (gemini-3.1-flash-live native audio). Both probes work: the root agent
  # ("もりのくまさん") gives a fixed self-introduction, so the response
  # reliably contains "もりのくま" / "事例の森" — use either as the Cloud
  # Monitoring matcher. Needs a ja-JP TTS voice so the audio probe's input
  # transcription recognizes the synthesized Japanese query. In us-central1,
  # so it shares the 30-session Live API cap (see README "us-central1 cap").
  - name: casestudiesforest-prod
    ws_url: wss://casestudiesforest-live-136865672131.us-central1.run.app
    query: "こんにちは。あなたのお名前は？"
    audio_timeout_seconds: 45
    tts_voice:
      language_code: ja-JP
      ssml_gender: NEUTRAL
